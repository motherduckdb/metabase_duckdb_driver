name: Build Container Images

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - docker/versions.json
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/motherduckdb/metabase-duckdb

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      latest_tag: ${{ steps.parse.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse versions.json into build matrix
        id: parse
        run: python3 docker/parse_versions.py --format json docker/versions.json

  build:
    needs: [generate-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker manifest inspect ${{ env.IMAGE_NAME }}:${{ matrix.tag }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Also tag :latest when this is the newest combination. parse_versions.py
          # sorts the matrix, so latest_tag is the highest version. The second line
          # evaluates to '' for every other combination and build-push-action drops it.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.tag }}
            ${{ matrix.tag == needs.generate-matrix.outputs.latest_tag && format('{0}:latest', env.IMAGE_NAME) || '' }}
          build-args: |
            METABASE_VERSION=${{ matrix.metabase_version }}
            METABASE_DUCKDB_DRIVER_VERSION=${{ matrix.driver_version }}
