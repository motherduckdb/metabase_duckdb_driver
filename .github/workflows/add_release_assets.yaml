name: Add .jar file to a release

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Download default .jar artifact
      uses: dawidd6/action-download-artifact@v11
      with:
        workflow: build_metabase_duckdb_driver.yaml
        workflow_conclusion: success
        commit: ${{ github.sha }}
        name: metabase-duckdb-driver

    - name: Download linux_amd64_musl .jar artifact
      uses: dawidd6/action-download-artifact@v11
      with:
        workflow: build_metabase_duckdb_driver.yaml
        workflow_conclusion: success
        commit: ${{ github.sha }}
        name: metabase-duckdb-driver-linux_amd64_musl

    - name: Download linux_arm64_musl .jar artifact
      uses: dawidd6/action-download-artifact@v11
      with:
        workflow: build_metabase_duckdb_driver.yaml
        workflow_conclusion: success
        commit: ${{ github.sha }}
        name: metabase-duckdb-driver-linux_arm64_musl

    - name: Add .jar artifacts to release
      uses: softprops/action-gh-release@v2.3.2
      with:
        generate_release_notes: true
        files: |
          duckdb.metabase-driver.jar
          duckdb-linux_amd64_musl.metabase-driver.jar
          duckdb-linux_arm64_musl.metabase-driver.jar
