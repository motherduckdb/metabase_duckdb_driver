name: Build Metabase DuckDB Driver

on:
  push:
    branches: [ main ]
  pull_request:

  workflow_dispatch:

env:
  # Derived rather than hardcoded so a fork pushes to its own namespace with no
  # edits to revert before opening a PR.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/metabase-duckdb

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v6
      with:
        repository: metabase/metabase
        path: metabase
        
    - name: Checkout driver code
      uses: actions/checkout@v6
      with:
        path: metabase/modules/drivers/duckdb
        
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: 'metabase/.nvmrc'

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.0.0
        
    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@13.4
      with:
        cli: latest
        
    - name: Build driver
      working-directory: ./metabase
      run: |
        python3 ./modules/drivers/duckdb/ci/patch-metabase.py
        chmod +x ./bin/build-driver.sh
        ./bin/build-driver.sh duckdb
        
    # release.yaml publishes this exact jar, so a commit stays releasable for as long as it is kept.
    - name: Upload driver artifact
      uses: actions/upload-artifact@v7
      with:
        name: metabase-duckdb-driver
        path: metabase/resources/modules/duckdb.metabase-driver.jar
        if-no-files-found: error
        retention-days: 60

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [motherduck, duckdb]
        # Metabase's full suite is ~21k tests, close to an hour in one lane; the test runner splits it deterministically.
        partition: [0, 1, 2]
    name: integration (${{ matrix.target }} ${{ matrix.partition }})

    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v6
      with:
        repository: metabase/metabase
        path: metabase

    - name: Checkout driver code
      uses: actions/checkout@v6
      with:
        path: metabase/modules/drivers/duckdb

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: 'metabase/.nvmrc'

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.0.0

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@13.4
      with:
        cli: latest

    - name: Register the driver in the Metabase checkout
      working-directory: ./metabase
      run: python3 ./modules/drivers/duckdb/ci/patch-metabase.py

    - name: Build static viz
      if: matrix.target == 'motherduck'
      working-directory: ./metabase
      run: |
        MB_EDITION=ee bun run build-static-viz

    - name: Run integration tests
      working-directory: ./metabase
      continue-on-error: true
      env:
        motherduck_token: ${{ matrix.target == 'motherduck' && secrets.motherduck_ci_user_token || '' }}
      run: |
        DRIVERS=${{ matrix.target }} clojure -X:dev:ci:ee:ee-dev:drivers:drivers-dev:test \
          :partition/total 3 :partition/index ${{ matrix.partition }}

  # The image bakes in the jar this run just built, so its contents always match
  # the source exactly. Release images are built by release.yaml.
  dev-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Fork PRs get a read-only token, so those build the image without pushing.
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v8
      with:
        name: metabase-duckdb-driver
        path: dist

    # pr-<number> on pull requests; <branch> and sha-<short-sha> on pushes.
    - name: Compute image tags
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=pr
          type=ref,event=branch
          type=sha

    - uses: docker/setup-buildx-action@v3

    # Metabase loads the driver lazily, so this also adds a DuckDB database and runs a query. amd64 only: buildx cannot
    # load a multi-platform image, and arm64 under emulation boots Metabase far too slowly. The push below reuses the cache.
    - name: Build amd64 image for the smoke test
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        load: true
        tags: metabase-duckdb:smoke
        build-args: |
          DUCKDB_DRIVER_URL=dist/duckdb.metabase-driver.jar

    - name: Smoke test
      run: python3 ci/smoke_image.py metabase-duckdb:smoke

    - name: Log in to ghcr.io
      if: env.PUSH == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ env.PUSH == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          DUCKDB_DRIVER_URL=dist/duckdb.metabase-driver.jar
