name: Build Metabase DuckDB Driver

on:
  push:
    branches: [ main ]
  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
            classifier: ''
            artifact: metabase-duckdb-driver
            jar: duckdb.metabase-driver.jar
          - name: linux_amd64_musl
            classifier: linux_amd64_musl
            artifact: metabase-duckdb-driver-linux_amd64_musl
            jar: duckdb-linux_amd64_musl.metabase-driver.jar
          - name: linux_arm64_musl
            classifier: linux_arm64_musl
            artifact: metabase-duckdb-driver-linux_arm64_musl
            jar: duckdb-linux_arm64_musl.metabase-driver.jar
    name: build (${{ matrix.variant.name }})

    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v6
      with:
        repository: metabase/metabase
        path: metabase

    - name: Checkout driver code
      uses: actions/checkout@v6
      with:
        path: metabase/modules/drivers/duckdb

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: 'metabase/.nvmrc'

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.0.0

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@13.4
      with:
        cli: latest

    - name: Apply duckdb_jdbc classifier
      if: matrix.variant.classifier != ''
      working-directory: ./metabase/modules/drivers/duckdb
      run: |
        python - <<'PY'
        from pathlib import Path
        classifier = "${{ matrix.variant.classifier }}"
        path = Path("deps.edn")
        text = path.read_text()
        original = "org.duckdb/duckdb_jdbc"
        replacement = f"{original}${classifier}"
        if replacement in text:
            pass
        elif original in text:
            path.write_text(text.replace(original, replacement, 1))
        else:
            raise SystemExit(f"Could not find {original} in deps.edn")
        print(path.read_text())
        PY

    - name: Build driver
      working-directory: ./metabase
      run: |
        git apply ./modules/drivers/duckdb/ci/metabase_drivers_deps.patch
        chmod +x ./bin/build-driver.sh
        ./bin/build-driver.sh duckdb

    - name: Rename jar for variant
      if: matrix.variant.jar != 'duckdb.metabase-driver.jar'
      run: |
        mv metabase/resources/modules/duckdb.metabase-driver.jar \
           metabase/resources/modules/${{ matrix.variant.jar }}

    - name: Upload driver artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.variant.artifact }}
        path: metabase/resources/modules/${{ matrix.variant.jar }}
        if-no-files-found: error

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [motherduck, duckdb]
    name: integration (${{ matrix.target }})

    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v6
      with:
        repository: metabase/metabase
        path: metabase

    - name: Checkout driver code
      uses: actions/checkout@v6
      with:
        path: metabase/modules/drivers/duckdb

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: 'metabase/.nvmrc'

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.0.0

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@13.4
      with:
        cli: latest

    - name: Patch Metabase test deps
      working-directory: ./metabase
      run: |
        python - <<'PY'
        from pathlib import Path

        def replace_once(path_str: str, old: str, new: str) -> None:
            path = Path(path_str)
            text = path.read_text()
            if new in text:
                return
            if old not in text:
                raise RuntimeError(f"Could not patch {path}: expected snippet not found")
            path.write_text(text.replace(old, new, 1))

        replace_once(
            "deps.edn",
            '    "modules/drivers/vertica/test"]}',
            '    "modules/drivers/vertica/test"\n'
            '    "modules/drivers/duckdb/test"\n'
            '    ]}',
        )
        replace_once(
            "modules/drivers/deps.edn",
            '  metabase/vertica            {:local/root "vertica"}}}',
            '  metabase/vertica            {:local/root "vertica"}\n'
            '  metabase/duckdb             {:local/root "duckdb"}\n'
            '  }}',
        )
        replace_once(
            ".clj-kondo/config.edn",
            '              :vertica}}',
            '              :vertica\n'
            '              :duckdb}}',
        )
        PY

    - name: Build static viz
      if: matrix.target == 'motherduck'
      working-directory: ./metabase
      run: |
        MB_EDITION=ee bun run build-static-viz

    - name: Run integration tests
      working-directory: ./metabase
      continue-on-error: true
      env:
        motherduck_token: ${{ matrix.target == 'motherduck' && secrets.motherduck_ci_user_token || '' }}
      run: |
        DRIVERS=${{ matrix.target }} clojure -X:dev:ci:ee:ee-dev:drivers:drivers-dev:test
