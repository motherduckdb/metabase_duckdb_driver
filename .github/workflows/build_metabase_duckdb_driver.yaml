name: Build Metabase DuckDB Driver

on:
  push:
    branches: [ main ]
  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v6
      with:
        repository: metabase/metabase
        path: metabase
        
    - name: Checkout driver code
      uses: actions/checkout@v6
      with:
        path: metabase/modules/drivers/duckdb
        
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: 'metabase/.nvmrc'

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.0.0
        
    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@13.4
      with:
        cli: latest
        
    - name: Build driver
      working-directory: ./metabase
      run: |
        python3 ./modules/drivers/duckdb/ci/patch-metabase.py
        chmod +x ./bin/build-driver.sh
        ./bin/build-driver.sh duckdb
        
    - name: Upload driver artifact
      uses: actions/upload-artifact@v7
      with:
        name: metabase-duckdb-driver
        path: metabase/resources/modules/duckdb.metabase-driver.jar
        if-no-files-found: error

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [motherduck, duckdb]
    name: integration (${{ matrix.target }})

    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v6
      with:
        repository: metabase/metabase
        path: metabase

    - name: Checkout driver code
      uses: actions/checkout@v6
      with:
        path: metabase/modules/drivers/duckdb

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: 'metabase/.nvmrc'

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v8.0.0

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@13.4
      with:
        cli: latest

    - name: Register the driver in the Metabase checkout
      working-directory: ./metabase
      run: python3 ./modules/drivers/duckdb/ci/patch-metabase.py

    - name: Build static viz
      if: matrix.target == 'motherduck'
      working-directory: ./metabase
      run: |
        MB_EDITION=ee bun run build-static-viz

    - name: Run integration tests
      working-directory: ./metabase
      continue-on-error: true
      env:
        motherduck_token: ${{ matrix.target == 'motherduck' && secrets.motherduck_ci_user_token || '' }}
      run: |
        DRIVERS=${{ matrix.target }} clojure -X:dev:ci:ee:ee-dev:drivers:drivers-dev:test
