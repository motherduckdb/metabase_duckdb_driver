# Metabase running the jar in ./dist. Driven by `make dev`.
services:
  metabase:
    build:
      context: .
      args:
        METABASE_VERSION: ${MB_VERSION:-}
        DUCKDB_DRIVER_URL: dist/duckdb.metabase-driver.jar
    ports:
      # MB_PORT lets a second worktree run its own Metabase side by side.
      - "${MB_PORT:-3000}:3000"
    environment:
      # Keep the setup wizard, saved questions and connections across restarts.
      MB_DB_FILE: /home/metabase/data/metabase.db
      # DuckDB picks this up, so `md:` connections work with an empty token field.
      motherduck_token: ${motherduck_token:-}
    volumes:
      # Drop .duckdb / .parquet files in ./data to query them from Metabase.
      - ./data:/home/metabase/data
